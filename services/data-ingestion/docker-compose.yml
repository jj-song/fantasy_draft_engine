version: '3.8'

services:
  data-ingestion:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL:-}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fantasy-network

networks:
  fantasy-network:
    external: true